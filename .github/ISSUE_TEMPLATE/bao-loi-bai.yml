name: Báo lỗi bài viết / Report an error in a post
description: Chỉ ra chỗ sai trong một bài trên minhhuunguyen.github.io / Point out a mistake in a post
title: "[Báo lỗi] "
labels: ["báo lỗi bài"]
body:
  - type: markdown
    attributes:
      value: |
        Cảm ơn bạn đã báo lỗi. Link bài và file nguồn đã được điền sẵn từ trang bạn vừa đọc.
        Thanks for the report. The post link and the source file are filled in from the page you were reading.
  - type: input
    id: page_url
    attributes:
      label: Link bài / Post URL
    validations:
      required: true
  - type: input
    id: source_file
    attributes:
      label: File nguồn / Source file
      description: Đường dẫn file trong repo site / Path of the file in the site repository
  - type: textarea
    id: problem
    attributes:
      label: Chỗ sai / What is wrong
      description: Đoạn nào, sai thế nào (công thức, code, link, ảnh, chính tả) / Which part, and how (formula, code, link, image, typo)
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Đề xuất sửa / Suggested fix
    validations:
      required: false
